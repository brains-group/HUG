# config/dataset_config.yaml
# ─────────────────────────────────────────────────────────────
# FuxiCTR dataset configuration for KuaiRand-1K
# Used by both DIN and BST experiments.
# ─────────────────────────────────────────────────────────────

kuairand_1k:
    data_root: /home/dasgua3/GCIC/Baselines/data/processed/
    data_format: csv
    train_data: /home/dasgua3/GCIC/Baselines/data/processed/kuairand_1k/train.csv
    valid_data: /home/dasgua3/GCIC/Baselines/data/processed/kuairand_1k/valid.csv
    test_data:  /home/dasgua3/GCIC/Baselines/data/processed/kuairand_1k/test.csv
    min_categr_count: 2        # drop tokens seen < 2 times → maps to OOV

    feature_cols:
        # ── User features ────────────────────────────────────
        - {name: user_id,
           active: True, dtype: str, type: categorical}

        - {name: user_active_degree,
           active: True, dtype: str, type: categorical}

        - {name: follow_user_num_range,
           active: True, dtype: str, type: categorical}

        - {name: fans_user_num_range,
           active: True, dtype: str, type: categorical}

        - {name: friend_user_num_range,
           active: True, dtype: str, type: categorical}

        - {name: register_days_range,
           active: True, dtype: str, type: categorical}

        # ── Item (video) features ────────────────────────────
        - {name: video_id,
           active: True, dtype: str, type: categorical}

        - {name: author_id,
           active: True, dtype: str, type: categorical}

        - {name: music_id,
           active: True, dtype: str, type: categorical}

        - {name: upload_type,
           active: True, dtype: str, type: categorical}

        - {name: duration_ms,
           active: True, dtype: float, type: numeric,
           normalizer: MinMaxScaler}

        # ── Context ──────────────────────────────────────────
        - {name: timestamp_norm,
           active: True, dtype: float, type: numeric}

        # ── Behaviour sequence  (KEY for DIN / BST) ──────────
        # Shares the embedding table with the target `video_id`
        # so attention can compare history tokens to the target.
        - {name: hist_video_ids,
           active: True,
           dtype: str,
           type: sequence,
           splitter: " ",
           max_len: 50,
           padding: pre,             # pad/truncate from the left
           feature_encoder: null,    # DIN/BST apply their own pooling; null disables pre-pooling
           share_embedding: video_id}

    label_col: {name: is_click, dtype: float}
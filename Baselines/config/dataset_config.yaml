# config/dataset_config.yaml
# ─────────────────────────────────────────────────────────────
# FuxiCTR dataset configuration for KuaiRand-1K.
# CSVs come from Baselines/preprocess.py: canonical rows, every feature from
# Framework/features.py (shared with HUG), holdout excluded from train.csv.
# Extra CSV columns (row_id, bucket_*) are not features and are ignored.
# Paths are relative to Baselines/ (train.py resolves them), so the repo can live anywhere.
#
# Three dataset ids over the same CSVs:
#   kuairand_1k_seq    hist_video_ids as a raw sequence   → TransAct
#   kuairand_1k        hist_video_ids mean-pooled         → WuKong
#   kuairand_1k_noseq  no behaviour sequence              → FiGNN, DCNv2
#
# hist_video_ids shares video_id's embedding table.  train.py (unless --vocab-from-history 1)
# gives it a per-column min_categr_count no token reaches, so the video_id vocabulary is fitted
# on the video_id column alone: FuxiCTR would otherwise add every frequent history token to it,
# and since histories hold only clicked videos, "video is in-vocab" would encode the label.
# Those runs use processed-data dirs <dataset_id>_itemvocab_m<count>.  The *_noseq ids have no
# history column and are unaffected.
# ─────────────────────────────────────────────────────────────

kuairand_1k_seq:
    data_root: data/processed/
    data_format: csv
    train_data: data/processed/kuairand_1k_csv/train.csv
    valid_data: data/processed/kuairand_1k_csv/valid.csv
    test_data: data/processed/kuairand_1k_csv/test.csv
    min_categr_count: 2        # overridden per tuning trial (dataset id gets a _m<count> suffix)

    feature_cols:
        - {name: user_id, active: True, dtype: str, type: categorical}
        - {name: [user_active_degree, is_lowactive_period, is_live_streamer, is_video_author, follow_user_num_range, fans_user_num_range, friend_user_num_range, register_days_range, onehot_feat0, onehot_feat1, onehot_feat2, onehot_feat3, onehot_feat4, onehot_feat5, onehot_feat6, onehot_feat7, onehot_feat8, onehot_feat9, onehot_feat10, onehot_feat11, onehot_feat12, onehot_feat13, onehot_feat14, onehot_feat15, onehot_feat16, onehot_feat17],
           active: True, dtype: str, type: categorical}
        - {name: video_id, active: True, dtype: str, type: categorical}
        - {name: [author_id, music_id, music_type, upload_type, primary_tag],
           active: True, dtype: str, type: categorical}
        # Item statistics as of each row: strictly earlier interactions only
        - {name: [duration_s, global_cvr, show_cnt_log, play_cnt_log, like_cnt_log, follow_cnt_log, share_cnt_log, comment_cnt_log],
           active: True, dtype: float, type: numeric, normalizer: StandardScaler}
        - {name: [tab, hour], active: True, dtype: str, type: categorical}
        # Last 50 clicked videos strictly before the row (features.click_history)
        - {name: hist_video_ids, active: True, dtype: str, type: sequence,
           splitter: " ", max_len: 50, padding: pre,
           feature_encoder: null,     # TransAct attends over the raw sequence
           share_embedding: video_id}

    label_col: {name: is_click, dtype: float}


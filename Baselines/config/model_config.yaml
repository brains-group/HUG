# config/model_config.yaml
# ─────────────────────────────────────────────────────────────
# FuxiCTR model configurations for the KuaiRand-1K baselines.
# Run with:
#   python Baselines/train.py --model TransAct --gpu 0 --run-dir runs/dev/TransAct
#   python Baselines/tune.py --model WuKong --trials 16 --out runs/tune/WuKong
#
# Early stopping and checkpoint selection use the validation split only
# (monitor below); the test split is evaluated once, after training.
#
# embedding_dim = 64 matches HUG's out_dim. Capacity should still be swept
# on validation before reporting (REVISION_WORKFLOW 1.3).
# ─────────────────────────────────────────────────────────────

Base:
    model_root: /home/dasgua3/HUG/Baselines/checkpoints/
    num_workers: 4
    verbose: 1
    early_stop_patience: 2
    pickle_feature_encoder: True
    save_best_only: True
    eval_steps: null
    debug_mode: False
    group_id: null
    use_features: null
    feature_specs: null
    feature_config: null

# ─────────────────────────────────────────────────────────────
# TransAct — Transformer over the user action sequence + DCNv2
# Xia et al., KDD 2023 (Pinterest)
# ─────────────────────────────────────────────────────────────
TransAct_kuairand_1k:
    model: TransAct
    dataset_id: kuairand_1k_seq
    loss: binary_crossentropy
    metrics: [logloss, AUC]
    task: binary_classification
    optimizer: adam
    learning_rate: 1.0e-3
    embedding_regularizer: 1.0e-6
    net_regularizer: 0
    batch_size: 4096
    embedding_dim: 64
    hidden_activations: relu
    dcn_cross_layers: 3
    dcn_hidden_units: [512, 256, 128]
    mlp_hidden_units: []
    num_heads: 2
    transformer_layers: 1
    transformer_dropout: 0.1
    dim_feedforward: 256
    net_dropout: 0.1
    target_item_field: video_id
    sequence_item_field: hist_video_ids
    first_k_cols: 1
    use_time_window_mask: False
    time_window_ms: 86400000
    concat_max_pool: True
    batch_norm: False
    epochs: 20
    shuffle: True
    seed: 2024
    monitor: AUC
    monitor_mode: max

# ─────────────────────────────────────────────────────────────
# WuKong — stacked factorization machines for scalable feature interaction
# Zhang et al., ICML 2024 (Meta)
# ─────────────────────────────────────────────────────────────
WuKong_kuairand_1k:
    model: WuKong
    dataset_id: kuairand_1k
    loss: binary_crossentropy
    metrics: [logloss, AUC]
    task: binary_classification
    optimizer: adam
    learning_rate: 1.0e-3
    embedding_regularizer: 1.0e-6
    net_regularizer: 0
    batch_size: 4096
    embedding_dim: 64
    num_wukong_layers: 3
    lcb_features: 16
    fmb_features: 16
    fmb_mlp_units: [256, 128]
    fmb_mlp_activations: relu
    fmp_rank_k: 8
    mlp_hidden_units: [256, 128]
    mlp_hidden_activations: relu
    mlp_batch_norm: True
    layer_norm: True
    net_dropout: 0.1
    epochs: 20
    shuffle: True
    seed: 2024
    monitor: AUC
    monitor_mode: max

# ─────────────────────────────────────────────────────────────
# FiGNN — graph neural network over feature fields (CIKM 2019)
# Fills the GNN-based CTR slot; no behaviour sequence (kuairand_1k_noseq).
# ─────────────────────────────────────────────────────────────
FiGNN_kuairand_1k:
    model: FiGNN
    dataset_id: kuairand_1k_noseq
    loss: binary_crossentropy
    metrics: [logloss, AUC]
    task: binary_classification
    optimizer: adam
    learning_rate: 1.0e-3
    embedding_regularizer: 1.0e-6
    net_regularizer: 0
    batch_size: 4096
    embedding_dim: 64
    gnn_layers: 3
    use_residual: True
    use_gru: True
    reuse_graph_layer: False
    epochs: 20
    shuffle: True
    seed: 2024
    monitor: AUC
    monitor_mode: max

# ─────────────────────────────────────────────────────────────
# DCNv2 — deep & cross network v2 (WWW 2021); optional reference
# ─────────────────────────────────────────────────────────────
DCNv2_kuairand_1k:
    model: DCNv2
    dataset_id: kuairand_1k_noseq
    loss: binary_crossentropy
    metrics: [logloss, AUC]
    task: binary_classification
    optimizer: adam
    model_structure: parallel
    use_low_rank_mixture: False
    low_rank: 32
    num_experts: 4
    learning_rate: 1.0e-3
    embedding_regularizer: 1.0e-6
    net_regularizer: 0
    batch_size: 4096
    embedding_dim: 64
    stacked_dnn_hidden_units: [512, 256, 128]
    parallel_dnn_hidden_units: [512, 256, 128]
    dnn_activations: relu
    num_cross_layers: 3
    net_dropout: 0.1
    batch_norm: False
    epochs: 20
    shuffle: True
    seed: 2024
    monitor: AUC
    monitor_mode: max


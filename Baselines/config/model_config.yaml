# config/model_config.yaml
# ─────────────────────────────────────────────────────────────
# FuxiCTR model configurations for DIN and BST on KuaiRand-1K.
# Run with:
#   cd model_zoo/DIN/DIN_torch
#   python run_expid.py --expid DIN_kuairand_1k --gpu 0
#
#   cd model_zoo/BST/BST_torch
#   python run_expid.py --expid BST_kuairand_1k --gpu 0
# ─────────────────────────────────────────────────────────────

Base:
    model_root: ../../checkpoints/
    workers: 4
    verbose: 1                    # show tqdm progress bar
    patience: 3                   # early-stop after 3 non-improving evals
    pickle_feature_encoder: True
    use_hdf5: True
    save_best_only: True
    every_x_epochs: 1
    debug: False
    partition_block_size: -1

# ─────────────────────────────────────────────────────────────
# DIN – Deep Interest Network (KDD 2018, Alibaba)
# ─────────────────────────────────────────────────────────────
DIN_kuairand_1k:
    model: DIN
    dataset_id: kuairand_1k

    loss: binary_crossentropy
    metrics: [logloss, AUC]
    task: binary_classification
    optimizer: adam
    learning_rate: 1.0e-3

    batch_size: 4096
    epochs: 20
    shuffle: True
    seed: 2024

    embedding_dim: 16
    embedding_regularizer: 1.0e-6

    # Must be lists of tuples: (target_field, sequence_field)
    din_target_field:
    - video_id

    din_sequence_field:
    - hist_video_ids

    # Attention parameters (actual DIN parameter names)
    attention_hidden_units: [64]
    attention_hidden_activations: Dice
    attention_output_activation: null
    attention_dropout: 0
    din_use_softmax: False

    # DNN head
    dnn_hidden_units: [512, 256, 128]
    dnn_activations: ReLU
    net_dropout: 0.1
    batch_norm: True
    net_regularizer: 0

    monitor: AUC
    monitor_mode: max

# ─────────────────────────────────────────────────────────────
# BST – Behaviour Sequence Transformer (DLP-KDD 2019, Alibaba)
# ─────────────────────────────────────────────────────────────
BST_kuairand_1k:
    model: BST
    dataset_id: kuairand_1k

    loss: binary_crossentropy
    metrics: [logloss, AUC]
    task: binary_classification
    optimizer: adam
    learning_rate: 1.0e-3

    batch_size: 2048
    epochs: 20
    shuffle: True
    seed: 2024

    embedding_dim: 16
    embedding_regularizer: 1.0e-6

    # Must be lists of tuples: (target_field, sequence_field)
    bst_target_field:
    - video_id

    bst_sequence_field:
    - hist_video_ids

    # Transformer parameters (actual BST parameter names)
    num_heads: 4
    stacked_transformer_layers: 2      # was transformer_layers
    attention_dropout: 0
    layer_norm: True
    use_residual: True

    # DNN head
    dnn_hidden_units: [512, 256, 128]
    dnn_activations: ReLU
    net_dropout: 0.2
    batch_norm: True
    net_regularizer: 0

    monitor: AUC
    monitor_mode: max

    seq_pooling_type: target      # "mean", "sum", "target", or "concat"
    use_position_emb: True
    use_causal_mask: False
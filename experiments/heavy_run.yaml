    seed: 44
    memory: heavy
    model: HUG
    arm: N4
    group: N4
    depends_on: []
  - name: hug_N1_s42
    kind: hug
    args: "{best:tune_hug_N4} --no-graph"
    seed: 42
    memory: heavy
    model: HUG
    arm: N1
    group: N1
    depends_on: []
  - name: hug_N1_s43

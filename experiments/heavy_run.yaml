# Heavy-run plan (Spec 04, "Heavy-run plan"). Prepared and dry-run; not executed by Spec 04.
#
#   python scripts/run_queue.py experiments/heavy_run.yaml --gpus 0,1 [--pack]
#   python scripts/run_queue.py experiments/heavy_run.yaml --dry-run --max-steps 50
#   python scripts/run_queue.py experiments/heavy_run.yaml --skip-optional   # drop DCNv2
#
# Job fields:
#   name        unique; the run dir is runs/heavy/<name>/
#   kind        hug | baseline | tune_hug | tune_baseline | final_eval
#   args        extra CLI args; "{best:<tune_job>}" expands to --params runs/heavy/<tune_job>/best.yaml
#               (and makes the job depend on that tuning job)
#   seed        passed as --seed for hug/baseline (tuning jobs carry --seed in args)
#   memory      heavy | light (with --pack, two light jobs may share a GPU)
#   depends_on  explicit dependencies (implicit ones: {best:...} and final_eval's "of")
#   of          final_eval only: the stage-1 job whose val-selected best.pt is scored on test
#   group       aggregation label (scripts/aggregate.py groups seeds by it)
#   optional    true for jobs that may be dropped with --skip-optional
#
# Stage 1 (val only): tuning, HUG arms, baselines. Stage 2: final_eval jobs, the only jobs
# that touch test (the queue adds --eval-test and a one-time token; never put it in args).
# To run Stage 1 alone: --only 'tune_*' --only 'hug_*' --only 'baseline_*'.

defaults:
  data_dir: KuaiRand-1K/data
  # Run once by the queue if <runs_root>/data_fingerprint.json is missing.
  fingerprint_cmd: "{python} Framework/fingerprint.py --data-dir {data_dir} --out {out}"
  # Spec 06 datasets (MIND, ZhihuRec): adapter fingerprint; also fills the bundle cache
  fingerprint_cmd_dataset: "{python} Framework/fingerprint.py --dataset {dataset} --out {out}"
  # Expected wall-clock minutes per job, used for the ETA in status.json until jobs of that
  # kind have finished (observed durations then take over).
  # TODO(W6.6): fill in from the W6 timing runs; null = unknown (excluded from the ETA).
  expected_minutes:
    tune_hug: null        # TODO: 16 trials
    tune_baseline: null   # TODO: 16 trials
    hug: null             # TODO
    baseline: null        # TODO
    final_eval: null      # TODO
  memory:
    hug: heavy
    tune_hug: heavy
    baseline: light
    tune_baseline: light
  # Extra args appended in --dry-run (after --max-steps): one trial per tuning job (W6.4).
  dry_run_args:
    tune_hug: "--trials 1"
    tune_baseline: "--trials 1"


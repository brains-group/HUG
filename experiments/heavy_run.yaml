  # ════════════════════════════════════════════════════════════════════════════
  # Spec 06 H: MIND and ZhihuRec. Every job carries `dataset:`; the queue appends
  # --dataset <name> to its command and hashes it with that dataset's fingerprint
  # (runs_root/data_fingerprint_<name>.json). KuaiRand jobs above are unchanged.
  # Per dataset: 8 tuning trials per model (HUG N4/N1, every baseline; fusion heads
  # sparse 8, evgate 6, misa 8), arms N0/N1/N2/N4 + sparse/evgate/misa, 3 seeds for
  # N1, N4, sparse and the best baseline, 1 seed for the rest. Baseline seeds 43/44 are
  # optional: after tuning, run them for the best baseline only, e.g.
  #   --only 'baseline_TransAct_s4[34]_mind' --only 'final_eval_baseline_TransAct_s4[34]_mind'
  # Not launched by spec 06: needs the user's sign-off (run-time estimate in
  # docs/specs/06-datasets-results.md).
  # ════════════════════════════════════════════════════════════════════════════


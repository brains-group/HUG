  # ── Stage 1a: tuning (16 trials each, val only) ──
  - name: tune_hug_N4
    kind: tune_hug
    args: "--arm N4 --trials 16 --seed 0"
    memory: heavy
    group: tune_hug_N4
    depends_on: []
  - name: tune_hug_N1
    kind: tune_hug
    args: "--arm N1 --trials 16 --seed 0"
